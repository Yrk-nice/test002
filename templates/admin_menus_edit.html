{% extends "base.html" %}

{% block content %}
<div class="layui-card">
  <div class="layui-card-header">{{ '编辑菜单' if row else '新增菜单' }}</div>
  <div class="layui-card-body">
    {% if error %}
    <div class="layui-alert layui-bg-red" style="margin-bottom:15px;padding:10px;color:#fff;">{{ error }}</div>
    {% endif %}
    <form class="layui-form" method="POST">
      <div class="layui-form-item">
        <label class="layui-form-label">名称</label>
        <div class="layui-input-block">
          <input type="text" name="name" value="{{ row['name'] if row else '' }}" required lay-verify="required" class="layui-input">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label">Endpoint</label>
        <div class="layui-input-block">
          <input type="text" name="endpoint" value="{{ row['endpoint'] if row else '' }}" placeholder="例如: admin_users 或 #" class="layui-input">
          <div class="layui-form-mid layui-word-aux">Flask 路由端点名称，如果是父级容器可填 #</div>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label">父级菜单</label>
        <div class="layui-input-block">
          <select name="parent_id">
            <option value="">(无 - 顶级菜单)</option>
            {% for p in parents %}
            <option value="{{ p.id }}" {{ 'selected' if row and row['parent_id'] == p.id else '' }}>{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label">排序</label>
        <div class="layui-input-block">
          <input type="number" name="order_num" value="{{ row['order_num'] if row else '0' }}" class="layui-input">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label">可见性</label>
        <div class="layui-input-block">
          <input type="checkbox" name="is_visible" title="显示" {{ 'checked' if not row or row['is_visible'] else '' }}>
        </div>
      </div>
      <div class="layui-form-item">
        <div class="layui-input-block">
          <button class="layui-btn" lay-submit>保存</button>
          <a href="{{ url_for('admin_menus_list') }}" class="layui-btn layui-btn-primary">返回</a>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
layui.use('form', function(){
  var form = layui.form;
  form.render();
});
</script>
{% endblock %}
